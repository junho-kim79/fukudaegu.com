<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福大邱 · 우리집 암기장</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E2A44">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<style>
:root{--ink:#1E2A44;--sub:#6A7185;--paper:#F6F1E7;--card:#FFFDF8;--line:#E6DDCB;--acc:#C8412B;--acc2:#FBE4DE;--ok:#2F7D5B;--ok2:#DDF1E6;--gold:#B8912F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;word-break:keep-all}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 16px 28px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.02rem;cursor:pointer}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1rem;box-shadow:0 3px 0 #0E1628}
.hanko{background:var(--acc)!important;box-shadow:0 3px 0 #9B2F1D!important;font-family:'Hiragino Mincho ProN','Noto Serif JP',serif}
.sign{text-align:center}.sign .sm{font-size:.8rem;font-weight:900;letter-spacing:.3em;color:var(--acc)}
.logo small{display:block;font-size:.66rem;font-weight:700;color:var(--sub);margin-top:1px}
.sp{flex:1}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 10px;font-size:.76rem;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.clock{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px}
.clock .d{font-size:.92rem;font-weight:800;opacity:.9}.clock .t{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.who .clock{width:100%;max-width:340px;margin-top:18px}
.dday{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.dday span{flex-shrink:0;font-size:.78rem;font-weight:900;padding:6px 11px;border-radius:999px;background:var(--acc2);color:var(--acc)}
.dday span.past{background:#EEE;color:#999}
.tabs{display:flex;gap:6px;margin-top:10px;background:#ECE5D7;border-radius:16px;padding:5px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:none;background:none;border-radius:12px;padding:11px 12px;font-weight:900;font-size:.98rem;color:var(--sub);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.stats{display:flex;gap:6px;margin-top:10px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stats span{display:block;font-size:.72rem;font-weight:700;color:var(--sub)}.stats b{font-size:1.12rem;font-weight:900}
.prog{height:6px;background:#ECE5D7;border-radius:6px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 18px 18px;box-shadow:0 10px 26px rgba(18,53,31,.07);position:relative}
.step{display:flex;gap:6px;align-items:center;font-size:.82rem;font-weight:900;color:var(--sub);padding-right:90px}
.step i{font-style:normal;padding:4px 9px;border-radius:999px;background:#EFE8DA}.step i.on{background:var(--ink);color:#fff}
.box{position:absolute;top:18px;right:16px;font-size:.78rem;font-weight:900;color:var(--gold);text-align:right}
.q{text-align:center;margin:22px 0 8px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.q .big{font-size:2.4rem;font-weight:900;line-height:1.25}
.q .big.mid{font-size:1.7rem}.q .big.long{font-size:1.25rem;line-height:1.6;font-weight:800}
.q .sub{margin-top:8px;font-size:.95rem;font-weight:700;color:var(--sub)}
.ask{text-align:center;font-size:.98rem;font-weight:900;color:var(--acc);margin-bottom:12px}
.opts{display:grid;gap:9px}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:16px 14px;font-size:1.08rem;font-weight:800;color:var(--ink);cursor:pointer;line-height:1.4;transition:transform .08s}
.opts button:active{transform:scale(.98)}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.ng{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.reveal{margin-top:12px;border-radius:18px;background:#F1ECE1;padding:12px 14px;display:none;text-align:center}
.reveal.on{display:block;animation:pop .2s ease}
.reveal .t{font-size:1.15rem;font-weight:900;line-height:1.5}.reveal .t em{font-style:normal;color:var(--acc)}
.reveal .tip,.tipb{margin-top:8px;font-size:.92rem;font-weight:800;line-height:1.55;color:#7A5A12;background:#FBF2D9;border-radius:12px;padding:8px 10px;text-align:left}
.reveal .e{margin-top:6px;font-size:.95rem;color:var(--sub);line-height:1.6;white-space:pre-line}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.card.okfx{box-shadow:0 0 0 3px rgba(30,122,76,.35),0 10px 26px rgba(18,53,31,.07)}
.card.ngfx{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.next{display:none;width:100%;margin-top:10px;border:none;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font-weight:900;font-size:1rem;cursor:pointer}
.next.on{display:block}
.say{border:1px solid var(--line);background:#fff;color:inherit;border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer;margin-top:8px}
.empty{text-align:center;padding:26px 6px;color:var(--sub);font-weight:700;line-height:1.8}
.empty b{color:var(--ink)}
.foot{margin-top:auto;padding-top:18px;text-align:center;font-size:.7rem;color:#A39C8C;line-height:1.7}
.foot a{color:inherit}
/* 사람 고르기 */
.who{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.who.off{display:none}
.who h1{font-size:1.5rem;font-weight:900;margin-top:14px}.who p{color:var(--sub);font-weight:700;margin-top:4px;font-size:.92rem}
.people{display:grid;gap:10px;width:100%;max-width:340px;margin-top:22px}
.people button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:16px;font-size:1.08rem;font-weight:900;color:var(--ink);cursor:pointer;text-align:left}
.people button i{font-style:normal;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;color:#fff}
.people button small{display:block;font-size:.74rem;color:var(--sub);font-weight:700;margin-top:2px}
.who .back{margin-top:22px;font-size:.82rem;color:var(--sub);font-weight:800;text-decoration:none}
/* 잠금 */
.lock{position:fixed;inset:0;z-index:31;background:var(--paper);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lock.on{display:flex}
.lock h2{margin-top:14px;font-size:1.35rem;font-weight:900}.lock p{color:var(--sub);font-weight:700;margin-top:4px}
.dots{display:flex;gap:12px;margin:22px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border:1px solid var(--line);background:var(--card);border-radius:18px;font-size:1.5rem;font-weight:800;color:var(--ink);cursor:pointer}
/* 시트 */
.sheet{position:fixed;inset:0;background:rgba(18,53,31,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet>div{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 18px 28px}
.sheet h3{font-size:1.05rem;font-weight:900;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:.9rem}
.seg{display:flex;gap:4px;background:#ECE5D7;border-radius:12px;padding:3px}.seg button{border:none;background:none;border-radius:9px;padding:6px 12px;font-weight:900;color:var(--sub);cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.li{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:.98rem}.li b{font-weight:900}.li span{color:var(--acc);font-weight:700}
.fld{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem;background:#fff;font-family:inherit;margin-top:6px}
textarea.fld{min-height:170px;line-height:1.6;resize:vertical}
.lbl{font-size:.8rem;font-weight:900;color:var(--sub);margin-top:12px;display:block}
.hint{font-size:.78rem;color:var(--sub);line-height:1.6;margin-top:6px}
.pbtn{width:100%;margin-top:14px;border:none;border-radius:14px;padding:13px;background:var(--ink);color:#fff;font-weight:900;font-size:1rem;cursor:pointer}
.danger{margin-top:14px;width:100%;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:14px;padding:11px;font-weight:900;cursor:pointer}
.ex-row{display:flex;gap:6px;align-items:center;margin-top:6px}.ex-row .fld{margin:0}
.x{border:none;background:none;color:var(--acc);font-weight:900;font-size:1.1rem;cursor:pointer;padding:4px 8px}
/* 전체 보기 */
.bookv{position:fixed;inset:0;z-index:15;background:var(--paper);display:none;overflow:auto;padding:0 12px 40px}
.bookv.on{display:block}
.bv-top{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:6px;align-items:center;padding:12px 0 8px}
.bv-top input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1rem;background:#fff}
.bv-h{margin:14px 2px 6px;font-weight:900;color:var(--acc);font-size:.92rem}
.bv-row{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:5px;cursor:pointer}
.bv-row .k{font-weight:900;font-size:1.05rem}.bv-row .k i{font-style:normal;color:var(--acc);font-size:.75rem;vertical-align:top}
.bv-row .m{font-weight:700;font-size:.96rem;color:#2F4A39}
.bv-row .ex{grid-column:1/-1;font-size:.86rem;color:var(--sub);line-height:1.6;border-top:1px dashed var(--line);padding-top:6px;white-space:pre-line}
.bv-row .hid{color:transparent;background:#EFE8DA;border-radius:6px}
.bv-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:58px;background:var(--paper);z-index:2}
.bv-tabs button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;color:var(--sub);cursor:pointer}
.bv-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bk-u{margin:18px 2px 8px;font-size:1.15rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px}
.bk-u:before{content:'';width:6px;height:20px;border-radius:3px;background:var(--acc)}
.bk{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-top:10px}
.bk h4{font-size:1.02rem;font-weight:900;color:var(--acc);margin-bottom:6px}
.bk .ld{font-size:.95rem;line-height:1.65;font-weight:600;margin-bottom:6px}
.bk .kv{display:grid;grid-template-columns:minmax(84px,.8fr) 1.6fr;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:.93rem;line-height:1.55;cursor:pointer}
.bk .kv:first-of-type{border-top:none}
.bk .kv b{font-weight:900;white-space:pre-line}.bk .kv span{font-weight:600;color:#2E3A55}
.bk .kv span.hid{color:transparent;background:#EFE8DA;border-radius:6px}
.bk table{width:100%;border-collapse:collapse;margin-top:6px;font-size:.88rem;text-align:center}
.bk th{background:var(--ink);color:#fff;font-weight:800;padding:7px 4px}
.bk th:first-child{border-radius:10px 0 0 0}.bk th:last-child{border-radius:0 10px 0 0}
.bk td{border-bottom:1px solid var(--line);padding:7px 4px;font-weight:700}
.bk td .kn{display:block;font-size:1.45rem;font-weight:700;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}.bk td small{display:block;font-size:.85rem;color:var(--acc);font-weight:900}.bk td small.hid{color:transparent;background:#EFE8DA;border-radius:4px}
.bk td.hid{color:transparent;background:#EFE8DA}
.bk .key{margin-top:10px;background:#EEF0F7;border-radius:12px;padding:9px 11px;font-size:.88rem;line-height:1.6;font-weight:700}
.bk .key i{font-style:normal;color:var(--acc);font-weight:900;margin-right:4px}
.bk .tp{margin-top:8px;background:#FBF2D9;color:#7A5A12;border-radius:12px;padding:8px 11px;font-size:.88rem;line-height:1.6;font-weight:800}
.bv-row .del{grid-column:1/-1;justify-self:end;font-size:.74rem;color:var(--acc);font-weight:800}

/* ───── 🎮 레슨 (상호작용) ───── */
.lsbtn{width:100%;margin-top:12px;border:none;border-radius:18px;padding:15px;background:linear-gradient(135deg,#58CC02,#46A302);color:#fff;font-weight:900;font-size:1.08rem;box-shadow:0 4px 0 #3A8A02;cursor:pointer}
.lsbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3A8A02}
.lsbtn small{display:block;font-size:.75rem;font-weight:700;opacity:.9;margin-top:2px}
.ls{position:fixed;inset:0;z-index:40;background:#fff;display:none;flex-direction:column}
.ls.on{display:flex}
.ls-top{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:520px;width:100%;margin:0 auto}
.ls-x{border:none;background:none;font-size:1.6rem;color:#AFAFAF;cursor:pointer;line-height:1}
.ls-bar{flex:1;height:16px;border-radius:10px;background:#E5E5E5;overflow:hidden}.ls-bar i{display:block;height:100%;background:#58CC02;border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.ls-combo{font-weight:900;color:#FF9600;font-size:.95rem;min-width:44px;text-align:right}
.ls-body{flex:1;overflow:auto;max-width:520px;width:100%;margin:0 auto;padding:10px 18px 20px}
.ls-h{font-size:1.35rem;font-weight:900;color:#3C3C3C;margin:10px 0 16px}
.ls-say{display:flex;align-items:center;gap:12px;border:2px solid #E5E5E5;border-radius:18px;padding:14px 16px;margin-bottom:18px}
.ls-say .spk{width:54px;height:54px;border-radius:14px;border:none;background:#1CB0F6;color:#fff;font-size:1.5rem;box-shadow:0 4px 0 #1899D6;cursor:pointer;flex-shrink:0}
.ls-say .spk.slow{width:42px;height:42px;font-size:1.05rem;background:#fff;color:#1CB0F6;border:2px solid #E5E5E5;box-shadow:0 3px 0 #E5E5E5}
.ls-say .jp{font-size:2rem;font-weight:700;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;line-height:1.2}
.ls-say .rd{font-size:1rem;font-weight:900;color:#1CB0F6;margin-top:2px}
.ls-say .mn{font-size:1.15rem;font-weight:900;color:#3C3C3C}
.ls-ch{display:grid;gap:10px}
.ls-ch.two{grid-template-columns:1fr 1fr}
.ls-ch button,.ls-tile,.ls-m button{border:2px solid #E5E5E5;background:#fff;border-radius:16px;padding:14px 12px;font-size:1.15rem;font-weight:800;color:#3C3C3C;box-shadow:0 4px 0 #E5E5E5;cursor:pointer;font-family:inherit}
.ls-ch button small,.ls-m button small{display:block;font-size:.8rem;color:#1CB0F6;font-weight:900;margin-top:2px}
.ls-ch button.sel,.ls-m button.sel{border-color:#84D8FF;background:#DDF4FF;box-shadow:0 4px 0 #84D8FF}
.ls-ch button.big{font-size:2rem;padding:18px 8px;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
.ls-m{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ls-m button.done{opacity:.25;pointer-events:none;box-shadow:none}
.ls-m button.bad{border-color:#FF4B4B;background:#FFDFE0;animation:shake .3s}
.ls-m button.good{border-color:#58CC02;background:#D7FFB8}
.ls-line{min-height:64px;border-bottom:2px solid #E5E5E5;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px}
.ls-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ls-tile{padding:10px 14px;font-size:1.15rem;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
.ls-tile small{display:block;font-size:.72rem;color:#1CB0F6;font-weight:900;font-family:inherit}
.ls-tile.gone{visibility:hidden}
.ls-mic{display:block;margin:26px auto 10px;width:96px;height:96px;border-radius:24px;border:none;background:#1CB0F6;color:#fff;font-size:2.4rem;box-shadow:0 5px 0 #1899D6;cursor:pointer}
.ls-mic.rec{background:#FF4B4B;box-shadow:0 5px 0 #EA2B2B;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.ls-heard{text-align:center;font-weight:800;color:#777;min-height:1.4em}
.ls-skip{display:block;margin:10px auto;border:none;background:none;color:#AFAFAF;font-weight:900;font-size:.9rem;cursor:pointer}
.ls-foot{border-top:2px solid #E5E5E5;padding:14px 18px 22px}
.ls-foot>div{max-width:520px;margin:0 auto}
.ls-foot.ok{background:#D7FFB8;border-color:#D7FFB8}.ls-foot.ng{background:#FFDFE0;border-color:#FFDFE0}
.ls-fb{font-weight:900;font-size:1.2rem;margin-bottom:10px;display:none}
.ls-foot.ok .ls-fb{display:block;color:#58A700}.ls-foot.ng .ls-fb{display:block;color:#EA2B2B}
.ls-fb small{display:block;font-size:.95rem;font-weight:800;margin-top:4px}
.ls-go{width:100%;border:none;border-radius:16px;padding:15px;font-weight:900;font-size:1.05rem;background:#58CC02;color:#fff;box-shadow:0 4px 0 #58A700;cursor:pointer}
.ls-go:disabled{background:#E5E5E5;color:#AFAFAF;box-shadow:0 4px 0 #CFCFCF}
.ls-foot.ng .ls-go{background:#FF4B4B;box-shadow:0 4px 0 #EA2B2B}
.ls-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:60;font-size:1.8rem;font-weight:900;color:#FF9600;opacity:0;pointer-events:none;transition:.25s;text-shadow:0 3px 0 #fff}
.ls-pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ls-end{text-align:center;padding-top:40px}
.ls-end .em{font-size:5rem;animation:pop .5s}
.ls-end h2{font-size:1.6rem;font-weight:900;color:#FFC800;margin-top:8px}
.ls-end .st{display:flex;gap:10px;justify-content:center;margin-top:22px}
.ls-end .st div{border:2px solid;border-radius:16px;padding:10px 14px;min-width:92px;font-weight:900}
.ls-end .st span{display:block;font-size:.75rem;color:#fff;margin:-10px -14px 8px;padding:4px;border-radius:12px 12px 0 0}
.cf{position:fixed;top:-10px;width:10px;height:14px;z-index:70;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" onclick="switchWho()"><div class="mark" id="meMark">福</div><div><span id="meName">암기장</span><small>시험범위 무한 반복</small></div></div>
    <div class="sp"></div>
    <button class="ibtn" onclick="openBook()">📖 책 보기</button>
    <button class="ibtn" onclick="openSheet('review')">📕 오답</button>
    <button class="ibtn" onclick="openSheet('set')">⚙︎</button>
  </header>
  <div class="clock"><span class="d" data-clk="d"></span><span class="t" data-clk="t"></span></div>
  <div class="dday" id="dday"></div>
  <div class="tabs" id="tabs"></div>
  <div class="stats">
    <div><span>오늘</span><b id="stToday">0</b></div>
    <div><span>정답률</span><b id="stRate">-</b></div>
    <div><span>🔥 연속</span><b id="stStreak">0</b></div>
    <div><span>외운 것</span><b id="stMaster">0</b></div>
  </div>
  <div class="prog"><i id="progBar" style="width:0"></i></div>
  <button class="lsbtn" onclick="startLesson()">🎮 레슨 시작<small id="lsSub">듣고 · 맞추고 · 만들고 · 말하기 · 12문제</small></button>
  <div class="card" id="card">

  <div class="mark" id="lockMark" style="width:60px;height:60px;font-size:1.6rem;border-radius:18px">암</div>

<script>
/* ───────── 아이들 (비밀번호는 저장하지 않고, 변환한 값만 비교) ─────────
   각자의 시험범위(사진으로 만든 문제)는 data/study/<id>.enc 에 본인 비밀번호로 잠겨 있어요. */
const PEOPLE = [
  { id: 'dad', name: '아빠', mark: '福', color: '#C8412B', href: '/n3.html', sub: '일본어 JLPT N3' },
  { id: 'dongwon', name: '김동원', mark: '동', color: '#12351F', check: '79bbece755c99e844f6cce0ab9e02362c0794d259321e0af1dc60dbaf8d8a925' },
  { id: 'kyungwon', name: '김경원', mark: '경', color: '#E8560A', check: 'e61fcb1ed7a3c52fdb69928f6bc731583f51ac4350a7b114f836af1f83c33cd6' },
  { id: 'jiyun', name: '김지윤', mark: '윤', color: '#B8912F', check: 'c288bea5e9f85127402dd7a15edccd169633eb4dd50e31f9ff9d83052f021ad3' }
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

async function deriveBits(p, pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode('ipsipass-study-' + p.id), iterations: 200000, hash: 'SHA-256' }, base, 256));
}
async function checkOf(bits) { return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', bits))); }

/* ───────── 오늘 날짜 · 실시간 시계 ───────── */
let clkDay = '';
function tickClock() {
  const n = new Date(), W = '일월화수목금토';
  const d = `${n.getFullYear()}년 ${n.getMonth() + 1}월 ${n.getDate()}일 (${W[n.getDay()]})`;
  const t = [n.getHours(), n.getMinutes(), n.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
  document.querySelectorAll('[data-clk="d"]').forEach(e => e.textContent = d);
  document.querySelectorAll('[data-clk="t"]').forEach(e => e.textContent = t);
  if (clkDay && clkDay !== d && S) { if (S.day !== todayStr()) { S.day = todayStr(); S.today = 0; save(); updStats(); } renderDday(); }   // 자정 넘으면 D-day·오늘 개수 새로
  clkDay = d;
}
setInterval(tickClock, 1000);

/* ───────── 사람 고르기 · 잠금 ───────── */
let ME = null, KEYBITS = null;
$('people').innerHTML = PEOPLE.map((p, i) => `<button onclick="pickWho(${i})"><i style="background:${p.color}">${p.mark}</i><div>${p.name} 암기장<small>${p.sub ? p.sub + ' · 🔒 비밀번호' : '바로 들어가기'}</small></div></button>`).join('');
function pickWho(i) {
  const p = PEOPLE[i];
  if (p.href) { location.href = p.href; return; }
  deriveBits(p, '000000').then(bits => unlock(p, bits));   // 아이들은 비밀번호 없이 바로
  return;
  const saved = ls.get('ipsi_study_key_' + p.id);   // 이 폰에서 한 번 열었으면 바로
  if (saved) checkOf(unhex(saved)).then(c => { if (p.check && c === p.check) unlock(p, unhex(saved)); else openLock(p); }).catch(() => openLock(p));
  else openLock(p);
}
let lockP = null, pinVal = '';
function openLock(p) {
  lockP = p; pinVal = ''; drawPin();
  $('lockName').textContent = p.name + ' 암기장'; $('lockMark').textContent = p.mark; $('lockMark').style.background = p.color;
  $('pinMsg').textContent = p.check ? '' : '아직 비밀번호가 정해지지 않았어요. 아빠한테 말해주세요.';
  $('lock').classList.add('on');
}
function closeLock() { $('lock').classList.remove('on'); lockP = null; }
function drawPin() { $('pinDots').innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<i class="${i < pinVal.length ? 'f' : ''}"></i>`).join(''); }
tickClock();
$('pinPad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('');
$('pinPad').querySelectorAll('button').forEach(b => b.onclick = async () => {
  if (!lockP) return;
  const k = b.dataset.k;
  if (k === '⌫') pinVal = pinVal.slice(0, -1); else if (pinVal.length < 6) pinVal += k;
  drawPin();
  if (pinVal.length === 6) {
    const p = lockP;
    $('pinMsg').textContent = '확인 중…';
    const bits = await deriveBits(p, pinVal);
    if (p.check && await checkOf(bits) === p.check) { ls.set('ipsi_study_key_' + p.id, hex(bits)); unlock(p, bits); }
    else { $('pinMsg').textContent = '비밀번호가 달라요'; pinVal = ''; drawPin(); if (navigator.vibrate) navigator.vibrate(80); }
  }
});
drawPin();
function switchWho() {   // 로고 누르면 잠그고 사람 고르기로
  if (ME) ls.del('ipsi_study_key_' + ME.id);
  ME = null; KEYBITS = null; $('who').classList.remove('off');
}

/* ───────── 데이터 & 저장 ─────────
   item: { s: 과목, u: 단원, k: 문제(앞), m: 답(뒤), e: 설명, st: 중요 } */
let BASE = { items: [], exams: [] }, ITEMS = [], S = null, KEY = '';
const blank = () => ({ sub: '전체', n: 4, speak: true, tick: 0, prog: {}, wrong: [], recent: [], day: '', today: 0, ok: 0, tot: 0, streak: 0, mine: [], exams: null, hidden: [] });
const save = () => ls.set(KEY, JSON.stringify(S));
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const idOf = it => it.s + '|' + it.k + '|' + it.m;

async function loadBase(p, bits) {
  try {
    const r = await fetch(`/data/study/${p.id}.enc?t=${Date.now()}`);
    if (!r.ok) return { items: [], exams: [] };
    const raw = Uint8Array.from(atob((await r.text()).trim()), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    const d = JSON.parse(new TextDecoder().decode(plain));
    return { items: d.items || [], exams: d.exams || [], book: d.book || [] };
  } catch (e) { return { items: [], exams: [] }; }
}
async function unlock(p, bits) {
  ME = p; KEYBITS = bits; KEY = 'ipsi_study_' + p.id;
  $('lock').classList.remove('on'); $('who').classList.add('off');
  $('meName').textContent = p.name + ' 암기장'; $('meMark').textContent = p.mark; $('meMark').style.background = p.color;
  S = blank(); try { const x = JSON.parse(ls.get(KEY) || 'null'); if (x) S = Object.assign(S, x); } catch (e) {}
  if (S.day !== todayStr()) { S.day = todayStr(); S.today = 0; }
  $('q').innerHTML = '<div class="sub">불러오는 중…</div>'; $('opts').innerHTML = ''; $('ask').textContent = '';
  BASE = await loadBase(p, bits);
  rebuild();
}
function rebuild() {
  const hid = new Set(S.hidden || []), seen = new Set();
  ITEMS = [...BASE.items, ...(S.mine || []).map(x => ({ ...x, mine: 1 }))].filter(x => x && x.k && x.m).filter(x => { const id = idOf(x); if (seen.has(id) || hid.has(id)) return false; seen.add(id); return true; });
  ITEMS.forEach(x => x.id = idOf(x));
  ITEMS.forEach(x => { if (isJa(x.k) && [...x.k].length === 1) KANA[x.k] = x.m; });   // 글자 타일 읽기
  renderTabs(); renderDday(); updStats(); nextQ();
}
const subjects = () => [...new Set(ITEMS.map(x => x.s || '기타'))];
const pool = () => S.sub === '전체' ? ITEMS : ITEMS.filter(x => (x.s || '기타') === S.sub);

function renderTabs() {
  const subs = subjects();
  if (S.sub !== '전체' && !subs.includes(S.sub)) S.sub = '전체';
  $('tabs').innerHTML = ['전체', ...subs].map(s => `<button class="${s === S.sub ? 'on' : ''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { S.sub = b.dataset.s; save(); renderTabs(); updStats(); nextQ(); });
}
function renderDday() {
  const ex = S.exams || BASE.exams || [];
  const t0 = new Date(todayStr());
  $('dday').innerHTML = ex.slice().sort((a, b) => a.d.localeCompare(b.d)).map(x => {
    const n = Math.round((new Date(x.d) - t0) / 864e5);
    return `<span class="${n < 0 ? 'past' : ''}">${esc(x.s)} ${n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : '끝'}</span>`;
  }).join('');
}

/* ───────── 반복 스케줄 (라이트너 상자, 福大邱와 같은 방식) ───────── */
const GAP = [8, 25, 60, 150, 350, 800], WRONG_GAP = 6, ACTIVE = 15;
function st(id) { return S.prog[id] || (S.prog[id] = { b: 0, due: 0, seen: 0 }); }
function pick() {
  const list = pool(), p = S.prog;
  const recentN = Math.min(8, Math.floor(list.length / 3));
  const rec = S.recent.slice(0, recentN), ok = x => !rec.includes(x.id);
  const seen = list.filter(x => p[x.id] && p[x.id].seen);
  const learning = seen.filter(x => p[x.id].b < 2);
  const due = seen.filter(x => p[x.id].due <= S.tick && ok(x)).sort((a, b) => p[a.id].due - p[b.id].due);
  if (due.length && (learning.length >= ACTIVE || Math.random() < .6)) return due[0];
  const fresh = list.filter(x => !(p[x.id] && p[x.id].seen)).sort((a, b) => (b.st || 0) - (a.st || 0));
  if (fresh.length && (learning.length < ACTIVE || !due.length)) return fresh[0];   // 중요 먼저, 범위 순서대로
  if (due.length) return due[0];
  const all = seen.filter(ok).sort((a, b) => (p[a.id].last || 0) - (p[b.id].last || 0));
  return all[0] || list[0];
}
function grade(id, good) {
  const s = st(id); s.seen++; s.last = S.tick;
  S.recent = [id, ...S.recent.filter(x => x !== id)].slice(0, 20);
  if (good) { s.b = Math.min(5, s.b + 1); s.due = S.tick + GAP[s.b]; S.wrong = S.wrong.filter(x => x !== id); }
  else { s.b = 0; s.due = S.tick + WRONG_GAP; if (!S.wrong.includes(id)) S.wrong.unshift(id); S.wrong = S.wrong.slice(0, 300); }
}

/* ───────── 문제 ───────── */
let cur = null, lock = false, finished = false;
const isEn = t => /^[\x20-\x7E’‘“”…–—]+$/.test(String(t || '').trim()) && /[a-z]/i.test(t);
const isJa = t => /[ぁ-んァ-ヶ]/.test(String(t || ''));
const canSay = t => isEn(t) || isJa(t);
const rOf = k => { const x = ITEMS.find(y => y.k === k); return x && x.r ? x.r : ''; };
function distract(field, item, n) {
  if (item.o && field === 'm') return shuffle([item.m, ...shuffle(item.o.filter(x => x !== item.m)).slice(0, n - 1)]);
  const fit = x => field !== 'k' || (!/[?？]$/.test(x.k) && !x.o && String(x.k).length <= 25);   // 거꾸로 문제엔 질문형 보기 빼기
  const same = shuffle(ITEMS.filter(x => x !== item && fit(x) && x[field] !== item[field] && (x.s || '') === (item.s || '')));
  const sameU = same.filter(x => x.u && x.u === item.u), others = same.filter(x => !sameU.includes(x));
  let c = [...sameU, ...others];
  const lenOk = x => Math.abs(String(x[field]).length - String(item[field]).length) <= Math.max(6, String(item[field]).length * .8);
  const ko = t => /[가-힣]/.test(String(t)), langOk = x => ko(x[field]) === ko(item[field]);   // 한글 답엔 한글 보기, 영어 답엔 영어 보기
  c = [...c.filter(x => langOk(x) && lenOk(x)), ...c.filter(x => langOk(x) && !lenOk(x)), ...c.filter(x => !langOk(x))];
  const rest = shuffle(ITEMS.filter(x => x !== item && fit(x) && x[field] !== item[field] && !c.includes(x)));
  const vals = [];
  for (const x of [...c, ...rest]) { if (vals.length >= n - 1) break; if (!vals.includes(x[field])) vals.push(x[field]); }
  return shuffle([item[field], ...vals]);
}
const bigCls = t => 'big' + (String(t).length > 22 ? ' long' : String(t).length > 8 ? ' mid' : '');
function newQ() {
  finished = false; lock = false;
  $('card').classList.remove('okfx', 'ngfx'); $('reveal').classList.remove('on'); $('nextBtn').classList.remove('on');
  if (!pool().length) {
    $('steps').innerHTML = ''; $('boxLv').textContent = ''; $('ask').textContent = ''; $('opts').innerHTML = '';
    $('q').innerHTML = `<div class="empty">아직 외울 게 없어요.<br><b>시험범위 사진</b>을 아빠한테 보내거나<br>⚙︎ → <b>직접 추가</b>로 넣어 보세요.</div>`;
    return;
  }
  if (ITEMS.length < 2) { $('q').innerHTML = '<div class="empty">문제가 2개 이상 있어야 보기를 만들 수 있어요.</div>'; $('opts').innerHTML = ''; return; }
  const item = pick();
  const okRev = x => !x.o && !/[?？]$/.test(x.k) && String(x.k).length <= 25 && String(x.m).length <= 40;
  const rev = okRev(item) && Math.random() < .3;   // 가끔 거꾸로: 답 → 문제
  cur = { item, type: rev ? 'm2k' : 'k2m', ok: true };
  const t = cur.type, s = S.prog[item.id];
  $('steps').innerHTML = `<i class="on">${esc(item.s || '기타')}${item.u ? ' · ' + esc(item.u) : ''}</i>`;
  $('boxLv').textContent = (item.st ? '⭐중요 · ' : '') + (s && s.seen ? '★'.repeat(s.b) + '☆'.repeat(5 - s.b) : 'NEW');
  const front = t === 'k2m' ? item.k : item.m, field = t === 'k2m' ? 'm' : 'k';
  cur.field = field;
  $('q').innerHTML = `<div class="${bigCls(front)}">${esc(front)}</div>${t === 'k2m' && item.r ? `<div class="sub" style="font-size:1.3rem;color:var(--acc);font-weight:900">${esc(item.r)}</div>` : ''}`;
  $('ask').textContent = t === 'k2m' ? (isJa(item.k) ? (item.r ? '무슨 뜻일까요?' : '어떻게 읽을까요?') : isEn(item.k) ? '뜻은?' : '답은?') : (isJa(item.k) ? '일본어로?' : isEn(item.k) ? '영어로?' : '무엇일까요?');
  const opts = distract(field, item, S.n);
  $('opts').innerHTML = opts.map(o => { const r = field === 'k' ? rOf(o) : ''; return `<button data-v="${esc(o)}">${esc(o)}${r ? `<small style="display:block;font-size:.85rem;opacity:.75;margin-top:2px">${esc(r)}</small>` : ''}</button>`; }).join('');
  $('opts').querySelectorAll('button').forEach(b => b.onclick = () => answer(b));
  if (t === 'k2m' && S.speak && (isEn(item.k) || (isJa(item.k) && item.r))) speak(item.k);
}
function answer(btn) {
  if (lock) return; lock = true;
  const right = String(cur.item[cur.field]), good = btn.dataset.v === right;
  $('opts').querySelectorAll('button').forEach(b => { if (b.dataset.v === right) b.classList.add('ok'); });
  if (!good) { btn.classList.add('ng'); $('card').classList.add('ngfx'); if (navigator.vibrate) navigator.vibrate(60); }
  else $('card').classList.add('okfx');
  S.tot++; S.today++; if (good) { S.ok++; S.streak++; } else S.streak = 0;
  if (good && S.speak && canSay(cur.item.k)) speak(cur.item.k);
  showReveal(); finishQ(good); $('nextBtn').classList.add('on'); lock = false;
}
function finishQ(good) { if (finished) return; finished = true; S.tick++; grade(cur.item.id, good); save(); updStats(); }
function showReveal() {
  const it = cur.item;
  let h = `<div class="t">${esc(it.k)}${it.r ? ` <small style="font-size:.9rem;color:var(--sub)">(${esc(it.r)})</small>` : ''} → <em>${esc(it.m)}</em></div>${it.e ? `<div class="e">${esc(it.e)}</div>` : ''}${it.t ? `<div class="tip">💡 ${esc(it.t)}</div>` : ''}`;
  if (canSay(it.k)) h += `<button class="say" data-t="${esc(it.k)}">🔊 발음</button>`;
  $('reveal').innerHTML = h; $('reveal').classList.add('on');
  $('reveal').querySelectorAll('.say').forEach(b => b.onclick = e => { e.stopPropagation(); speak(b.dataset.t); });
}
function nextQ() { newQ(); }
function speak(txt) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = isJa(txt) ? 'ja-JP' : 'en-US'; u.rate = isJa(txt) ? .85 : .92; speechSynthesis.speak(u); } catch (e) {} }

function updStats() {
  $('stToday').textContent = S.today;
  $('stRate').textContent = S.tot ? Math.round(S.ok / S.tot * 100) + '%' : '-';
  $('stStreak').textContent = S.streak;
  const list = pool(), m = list.filter(x => S.prog[x.id] && S.prog[x.id].b >= 3).length;

/* ───────── 🎮 레슨: 듣기 · 짝 맞추기 · 문장 만들기 · 말하기 (듀오링고처럼) ───────── */
let L = null;
const AC = window.AudioContext || window.webkitAudioContext; let actx = null;
function beep(good) {
  try { actx = actx || new AC(); const t = actx.currentTime;
    (good ? [[880, 0], [1320, .09]] : [[220, 0], [180, .12]]).forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = good ? 'sine' : 'square'; o.frequency.value = f; g.gain.setValueAtTime(.12, t + d); g.gain.exponentialRampToValueAtTime(.001, t + d + .18); o.connect(g); g.connect(actx.destination); o.start(t + d); o.stop(t + d + .2); });
  } catch (e) {}
}
function sayJ(txt, slow) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = isJa(txt) ? 'ja-JP' : 'en-US'; u.rate = slow ? .55 : .85; speechSynthesis.speak(u); } catch (e) {} }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function lessonPool() { return pool().filter(x => String(x.k).length <= 24 && String(x.m).length <= 30); }
function startLesson() {
  const P = lessonPool();
  if (P.length < 4) { alert('레슨을 하려면 문제가 4개 이상 있어야 해요'); return; }
  // 복습 + 새 것 섞기: 아직 덜 외운 것 위주
  const p = S.prog, score = x => { const q = p[x.id]; return (q && q.seen ? q.b * 10 : 25) + Math.random() * 18; };
  const base = P.slice().sort((a, b) => score(a) - score(b)).slice(0, 14);
  const ja = P.some(x => isJa(x.k));
  const plan = [];
  const pickOne = (f) => { const c = base.filter(f).filter(x => !plan.some(q => q.item === x)); return c[0] || null; };
  const types = ['pick', 'listen', 'match', 'pick', 'build', 'speak', 'listen', 'pick', 'match', 'build', 'speak', 'pick'];
  types.forEach(t => {
    if (t === 'match') { plan.push({ t }); return; }
    let it = null;
    if (t === 'build') it = pickOne(x => x.w && x.w.length >= 2) || pickOne(x => isJa(x.k) && [...x.k].length >= 2 && [...x.k].length <= 6);
    else if (t === 'listen' || t === 'speak') { if (!ja && !P.some(x => isEn(x.k))) t = 'pick'; it = pickOne(x => canSay(x.k)); }
    if (t === 'speak' && !SR) t = 'listen';
    if (!it) { t = 'pick'; it = pickOne(() => true) || base[Math.floor(Math.random() * base.length)]; }
    plan.push({ t, item: it });
  });
  L = { plan, i: 0, ok: 0, tot: 0, combo: 0, best: 0, xp: 0, P };
  $('ls').classList.add('on'); renderEx();
}
function quitLesson() { if (L && L.i > 0 && L.i < L.plan.length && !confirm('레슨을 그만할까요?')) return; $('ls').classList.remove('on'); L = null; try { speechSynthesis.cancel(); } catch (e) {} updStats(); }

}
function setGo(enabled, fn) { const g = $('lsGo'); g.disabled = !enabled; g.onclick = fn || null; }
const optLabel = (v, withR) => { const r = withR ? rOf(v) : ''; return `${esc(v)}${r ? `<small>${esc(r)}</small>` : ''}`; };
function renderEx() {

    B.querySelectorAll('#bBank button').forEach(x => x.onclick = () => { if (x.classList.contains('gone')) return; x.classList.add('gone'); line.push({ t: x.dataset.t, i: +x.dataset.i }); if (isJa(x.dataset.t)) sayJ(x.dataset.t); draw(); });
    const check = () => { const good = line.map(b => b.t).join(it.w ? ' ' : '') === tiles.join(it.w ? ' ' : ''); grade(it.id, good); S.tick++; save(); if (good) sayJ(it.k); result(good, `${it.k}${it.r ? ' (' + it.r + ')' : ''}`); };
  } else if (ex.t === 'speak') {
    B.innerHTML = `<div class="ls-h">듣고 따라 말해 보세요</div>
      <div class="ls-say"><button class="spk" id="exSpk">🔊</button><div><div class="jp">${esc(it.k)}</div>${it.r ? `<div class="rd">${esc(it.r)}</div>` : ''}<div style="font-size:.9rem;color:#777;font-weight:700">${esc(it.m)}</div></div></div>
      <button class="ls-mic" id="mic">🎤</button><div class="ls-heard" id="heard">마이크를 누르고 말해요</div>
      <button class="ls-skip" id="skip">지금 말할 수 없어요</button>`;
    $('exSpk').onclick = () => sayJ(it.k); setTimeout(() => sayJ(it.k), 250);
    $('skip').onclick = () => { L.i++; renderEx(); };
    $('mic').onclick = () => {
      try { speechSynthesis.cancel(); } catch (e) {}
      const r = new SR(); r.lang = isJa(it.k) ? 'ja-JP' : 'en-US'; r.interimResults = false; r.maxAlternatives = 5;
      $('mic').classList.add('rec'); $('heard').textContent = '듣고 있어요…';
      r.onresult = e => {
        const alts = [...e.results[0]].map(a => a.transcript);
        const norm = t => String(t).replace(/[\s、。！？!?.,ー〜]/g, '').toLowerCase();
        const want = [it.k, ...(it.kj || [])].map(norm);
        const good = alts.some(a => want.some(w => norm(a).includes(w) || w.includes(norm(a)) && norm(a).length >= Math.max(1, w.length - 1)));
        $('heard').textContent = '들린 말: ' + alts[0];
        grade(it.id, good); S.tick++; save();
        if (good) result(true, '발음 좋아요! 👏');
        else { result(false, '조금 다르게 들렸어요. 다시 해볼까요?', false, true); }
      };
      r.onerror = () => { $('heard').textContent = '소리를 못 들었어요. 다시 눌러 주세요'; };
      r.onend = () => $('mic').classList.remove('rec');
      try { r.start(); } catch (e) { $('heard').textContent = '이 폰에서는 마이크를 쓸 수 없어요'; }
    };
  }
}
const KANA = {};
function choose(B, isRight, it, ans) {
  let pickV = null;
  B.querySelectorAll('.ls-ch button').forEach(b => b.onclick = () => { B.querySelectorAll('.ls-ch button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); pickV = b.dataset.v; if (isJa(pickV) && [...pickV].length <= 6) sayJ(pickV); setGo(true, () => { const good = isRight(pickV); grade(it.id, good); S.tick++; save(); B.querySelectorAll('.ls-ch button').forEach(x => x.style.pointerEvents = 'none'); if (good) sayJ(it.k); result(good, ans); }); });
}
function result(good, ans, auto, retry) {
  L.tot++; S.tot++; S.today++;
  if (good) { L.ok++; S.ok++; L.combo++; S.streak++; L.best = Math.max(L.best, L.combo); L.xp += 10 + (L.combo >= 3 ? 5 : 0); }
  else { L.combo = 0; S.streak = 0; if (navigator.vibrate) navigator.vibrate(80); }
  save(); beep(good);
  $('lsCombo').textContent = L.combo >= 2 ? '🔥' + L.combo : '';
  if (good && [3, 5, 8, 10].includes(L.combo)) pop(L.combo + ' 콤보!');
  const msgs = good ? ['잘했어요!', '훌륭해요!', '정답!', '최고예요!', '완벽해요!'] : ['정답은:'];
  foot(good ? 'ok' : 'ng', `${good ? '✔ ' : '✖ '}${msgs[Math.floor(Math.random() * msgs.length)]}${ans ? `<small>${esc(ans)}</small>` : ''}`, '계속');
  setGo(true, () => { L.i++; renderEx(); });
  if (retry) { $('lsGo').textContent = '다시 말하기'; setGo(true, () => renderEx()); $('lsFb').insertAdjacentHTML('beforeend', `<button class="ls-skip" style="margin:6px 0 0" onclick="L.i++;renderEx()">넘어가기 →</button>`); }
}
function pop(t) { const p = $('lsPop'); p.textContent = t; p.classList.add('on'); setTimeout(() => p.classList.remove('on'), 900); }
function endLesson() {
  const today = todayStr(); S.days = S.days || [];
  if (!S.days.includes(today)) S.days.push(today);
  let streak = 0; for (let d = new Date(today); S.days.includes(d.toISOString().slice(0, 10)); d.setDate(d.getDate() - 1)) streak++;
  S.lessons = (S.lessons || 0) + 1; S.xp = (S.xp || 0) + L.xp; save();
  const rate = L.tot ? Math.round(L.ok / L.tot * 100) : 100;
  $('lsBar').style.width = '100%';
  $('lsBody').innerHTML = `<div class="ls-end"><div class="em">${rate >= 90 ? '🏆' : rate >= 60 ? '🎉' : '💪'}</div><h2>${rate >= 90 ? '완벽한 레슨!' : rate >= 60 ? '레슨 완료!' : '잘 버텼어요!'}</h2>
    <div class="st"><div style="border-color:#FFC800;color:#FFC800"><span style="background:#FFC800">경험치</span>⚡${L.xp}</div><div style="border-color:#58CC02;color:#58CC02"><span style="background:#58CC02">정답률</span>🎯${rate}%</div><div style="border-color:#FF9600;color:#FF9600"><span style="background:#FF9600">연속</span>🔥${streak}일</div></div>
    <p style="margin-top:18px;color:#777;font-weight:800">최고 콤보 ${L.best} · 지금까지 레슨 ${S.lessons}번 · 총 ⚡${S.xp}</p></div>`;
  foot('', '', '계속'); setGo(true, () => { $('ls').classList.remove('on'); L = null; updStats(); nextQ(); });
  beep(true); setTimeout(() => beep(true), 180);
  const colors = ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B', '#CE82FF'];
  for (let i = 0; i < 40; i++) { const c = document.createElement('i'); c.className = 'cf'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % 5]; c.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 3200); }
}
