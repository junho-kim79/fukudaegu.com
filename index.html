<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福大邱 · N3 무한 반복</title>
<meta name="description" content="JLPT N3 단어·한자·문법을 한자-히라가나-뜻 연결로 무한 반복하는 암기 앱">
<meta name="theme-color" content="#1E2A44">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-512.png">
<style>
:root{--ink:#1E2A44;--sub:#6A7185;--paper:#F6F1E7;--card:#FFFDF8;--line:#E6DDCB;--shu:#C8412B;--shu2:#FBE4DE;--ok:#2F7D5B;--ok2:#DDF1E6;--gold:#B8912F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Hiragino Sans','Noto Sans JP','Noto Sans KR',sans-serif;word-break:keep-all}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:14px 16px 28px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem}
.hanko{width:34px;height:34px;border-radius:9px;background:var(--shu);color:#fff;display:grid;place-items:center;font-size:1.05rem;font-family:'Hiragino Mincho ProN','Noto Serif JP',serif;box-shadow:0 3px 0 #9B2F1D}
.logo small{display:block;font-size:.66rem;font-weight:700;color:var(--sub);margin-top:1px}
.sp{flex:1}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 11px;font-size:.76rem;font-weight:800;color:var(--ink);cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;background:#EDE5D5;border-radius:16px;padding:5px}
.tabs button{border:none;background:none;border-radius:12px;padding:12px 4px;font-weight:900;font-size:1.05rem;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.stats{display:flex;gap:6px;margin-top:10px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.stats span{display:block;font-size:.72rem;font-weight:700;color:var(--sub)}.stats b{font-size:1.15rem;font-weight:900}
.prog{height:6px;background:#EDE5D5;border-radius:6px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px 18px 18px;box-shadow:0 10px 26px rgba(30,42,68,.07);position:relative;flex:0 0 auto}
.step{display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:900;color:var(--sub)}
.step i{font-style:normal;padding:4px 9px;border-radius:999px;background:#EFE8DA}.step i.on{background:var(--ink);color:#fff}.step i.done{background:var(--ok2);color:var(--ok)}
.box{position:absolute;top:18px;right:16px;font-size:.8rem;font-weight:900;color:var(--gold)}
.q{text-align:center;margin:22px 0 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.q .big{font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;font-size:4.4rem;font-weight:700;line-height:1.15;letter-spacing:.02em}
.q .big.long{font-size:3rem}.q .big.ko{font-family:inherit;font-size:2.3rem;font-weight:900}
.q .sub{margin-top:10px;font-size:1.25rem;font-weight:700;color:var(--sub);min-height:1.4em}
.q .sub .kana{color:var(--shu);font-weight:900}
.q .sent{font-size:1.6rem;line-height:1.7;font-weight:700;font-family:'Hiragino Sans','Noto Sans JP',sans-serif}
.q .sent u{text-decoration:none;display:inline-block;min-width:4.2em;border-bottom:3px solid var(--shu);color:var(--shu)}
.ask{text-align:center;font-size:1rem;font-weight:900;color:var(--shu);margin-bottom:12px}
.opts{display:grid;gap:9px}
.opts button{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:18px 14px;font-size:1.3rem;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .08s}
.opts button:active{transform:scale(.98)}
.opts button.jp{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;font-size:1.5rem}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.ng{background:var(--shu2);border-color:var(--shu);color:var(--shu)}
.reveal{margin-top:12px;border-radius:18px;background:#F3EEE3;padding:12px 14px;display:none;text-align:center}
.reveal.on{display:block;animation:pop .2s ease}
.reveal .t{font-size:1.45rem;font-weight:900}.reveal .t span{font-family:'Hiragino Mincho ProN','Noto Serif JP',serif}
.reveal .r{color:var(--shu);font-weight:900}.reveal .e{margin-top:6px;font-size:1rem;color:var(--sub);line-height:1.6}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.card.okfx{box-shadow:0 0 0 3px rgba(47,125,91,.35),0 10px 26px rgba(30,42,68,.07)}
.card.ngfx{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.next{display:none;width:100%;margin-top:10px;border:none;border-radius:16px;padding:14px;background:var(--ink);color:#fff;font-weight:900;font-size:1rem;cursor:pointer}
.next.on{display:block}
.foot{margin-top:auto;padding-top:18px;text-align:center;font-size:.7rem;color:#A39C8C;line-height:1.7}
.sheet{position:fixed;inset:0;background:rgba(30,42,68,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet>div{width:100%;max-width:480px;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 18px 28px}
.sheet h3{font-size:1.05rem;font-weight:900;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-weight:700;font-size:.92rem}
.seg{display:flex;gap:4px;background:#EDE5D5;border-radius:12px;padding:3px}.seg button{border:none;background:none;border-radius:9px;padding:6px 12px;font-weight:900;color:var(--sub);cursor:pointer}.seg button.on{background:var(--ink);color:#fff}
.list{max-height:46vh;overflow:auto;margin-top:8px}
.li{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:1.05rem}.li b{font-family:'Hiragino Mincho ProN','Noto Serif JP',serif;min-width:4.5em}.li span{color:var(--shu);min-width:6em}
.lock{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lock h2{margin-top:14px;font-size:1.4rem;font-weight:900}.lock p{color:var(--sub);font-weight:700;margin-top:4px}
.lock.off{display:none}
.dots{display:flex;gap:12px;margin:22px 0}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border:1px solid var(--line);background:var(--card);border-radius:18px;font-size:1.5rem;font-weight:800;color:var(--ink);cursor:pointer}
.bookv{position:fixed;inset:0;z-index:15;background:var(--paper);display:none;overflow:auto;padding:0 12px 40px}
.bookv.on{display:block}
.bv-top{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;gap:6px;align-items:center;padding:12px 0 8px}
.bv-top input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1rem;background:#fff}
.bv-sec{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;position:sticky;top:58px;background:var(--paper);z-index:2}
.bv-sec button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:.85rem;color:var(--sub);cursor:pointer}
.bv-sec button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bv-h{margin:14px 2px 6px;font-weight:900;color:var(--shu);font-size:.95rem}
.bv-row{display:grid;grid-template-columns:1.1fr 1fr 1.1fr;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:5px;cursor:pointer}
.bv-row .k{font-family:'Hiragino Mincho ProN','Noto Serif JP',serif;font-size:1.35rem;font-weight:700}
.bv-row .k i{font-style:normal;color:var(--shu);font-size:.8rem;vertical-align:top}
.bv-row .r{color:var(--shu);font-weight:800;font-size:1.05rem}
.bv-row .m{font-weight:700;font-size:.98rem}
.bv-row .ex{grid-column:1/-1;font-size:.9rem;color:var(--sub);line-height:1.6;border-top:1px dashed var(--line);padding-top:6px}
.bv-row .hid{color:transparent;background:#EFE8DA;border-radius:6px}
.danger{margin-top:14px;width:100%;border:1px solid var(--shu);background:none;color:var(--shu);border-radius:14px;padding:11px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="hanko">福</div><div>福大邱 N3<small>보고 · 고르고 · 무한 반복</small></div></div>
    <div class="sp"></div>
    <button class="ibtn" onclick="openBook()">📖 책 보기</button>
    <button class="ibtn" onclick="openSheet('review')">📕 오답</button>
    <button class="ibtn" onclick="openSheet('set')">⚙︎</button>
  </header>

  <div class="tabs" id="tabs" style="grid-template-columns:repeat(4,1fr)">
    <button data-m="book">📘 책</button>
    <button data-m="words" class="on">단어</button>
    <button data-m="kanji">한자</button>
    <button data-m="grammar">문법</button>
  </div>

  <div class="stats">
    <div><span>오늘</span><b id="stToday">0</b></div>
    <div><span>정답률</span><b id="stRate">-</b></div>
    <div><span>🔥 연속</span><b id="stStreak">0</b></div>
    <div><span>외운 것</span><b id="stMaster">0</b></div>
  </div>
  <div class="prog"><i id="progBar" style="width:0"></i></div>

  <div class="card" id="card">
    <div class="step" id="steps"></div>
    <div class="box" id="boxLv"></div>
    <div class="q" id="q"></div>
    <div class="ask" id="ask"></div>

    <button class="next" id="nextBtn" onclick="nextQ()">다음 →</button>
  </div>

  <div class="foot">틀린 건 자주, 외운 건 가끔 나와요. 계속 누르다 보면 외워집니다.<br>단어 목록: JLPT N3 공개 단어 목록(tanos.co.uk 기반) · 한국어 뜻 재정리<br>福大邱 · fukudaegu.com</div>
</div>

<div class="lock" id="lock">
  <div class="hanko" style="width:64px;height:64px;font-size:2rem;border-radius:16px">福</div>
  <h2>福大邱 N3</h2><p>비밀번호 6자리</p>
  <div class="dots" id="pinDots"></div>
  <div class="pad" id="pinPad"></div>
  <p id="pinMsg" style="color:var(--shu);min-height:1.4em;margin-top:10px"></p>
</div>
<div class="bookv" id="bookv">
  <div class="bv-top">
    <button class="ibtn" onclick="closeBook()">‹ 닫기</button>
    <input id="bvQ" placeholder="찾기 (한자·읽기·뜻)" oninput="renderBook()">
    <button class="ibtn" id="bvHide" onclick="bvHide=(bvHide+1)%3;renderBook()">가리기</button>
  </div>
  <div class="bv-sec" id="bvSec"></div>
  <div id="bvList"></div>
</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div id="sheetBody"></div></div>

<script>
/* ───────── 데이터 & 저장 ───────── */
let D = { words: [], kanji: [], grammar: [], book: [] };
const KEY = 'fuku_n3_v1';
let S = { mode: 'words', n: 3, speak: true, tick: 0, prog: { words: {}, kanji: {}, grammar: {}, book: {} }, day: '', today: 0, ok: 0, tot: 0, streak: 0, wrong: { words: [], kanji: [], grammar: [], book: [] } };
try { const x = JSON.parse(localStorage.getItem(KEY) || 'null'); if (x) S = Object.assign(S, x); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const todayStr = () => new Date().toISOString().slice(0, 10);
if (S.day !== todayStr()) { S.day = todayStr(); S.today = 0; }
S.prog.book = S.prog.book || {}; S.wrong.book = S.wrong.book || [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ───────── 반복 스케줄 (라이트너 상자) ─────────
   상자 0~5. 맞히면 한 칸 올라가고, 틀리면 0으로.
   상자가 높을수록 다음에 나오는 간격이 길어짐. 새 단어는 조금씩 추가. */
const GAP = [2, 5, 11, 24, 50, 100];
const ACTIVE = 10;
function st(id) { const p = S.prog[S.mode]; return p[id] || (p[id] = { b: 0, due: 0, seen: 0 }); }
function pick() {
  const list = D[S.mode], p = S.prog[S.mode];
  const seenIds = list.map((_, i) => i).filter(i => p[i] && p[i].seen);
  const learning = seenIds.filter(i => p[i].b < 4);
  const due = seenIds.filter(i => p[i].due <= S.tick).sort((a, b) => p[a].due - p[b].due);
  if (due.length && (learning.length >= ACTIVE || Math.random() < .75)) return due[0];
  const fresh = list.map((_, i) => i).filter(i => !(p[i] && p[i].seen));
  if (S.mode === 'book') fresh.sort((a, b) => (list[b].st || 0) - (list[a].st || 0) || a - b);   // ★ 먼저, 책 순서대로
  if (fresh.length && learning.length < ACTIVE) return S.mode === 'book' ? fresh[0] : fresh[Math.floor(Math.random() * Math.min(fresh.length, 40))];
  if (due.length) return due[0];
  const all = seenIds.sort((a, b) => p[a].due - p[b].due); return all.length ? all[0] : 0;
}
function grade(id, good) {
  const s = st(id); s.seen++;
  if (good) { s.b = Math.min(5, s.b + 1); s.due = S.tick + GAP[s.b]; S.wrong[S.mode] = S.wrong[S.mode].filter(x => x !== id); }
  else { s.b = 0; s.due = S.tick + 2; if (!S.wrong[S.mode].includes(id)) S.wrong[S.mode].unshift(id); S.wrong[S.mode] = S.wrong[S.mode].slice(0, 200); }
}

/* ───────── 문제 만들기 ───────── */
let cur = null;   // { id, item, steps:[...], si, okAll }
function distract(field, item, n, sim) {
  const pool = D[S.mode].filter(x => x !== item && x[field] !== item[field]);
  let cand = sim ? pool.filter(sim) : [];
  cand = shuffle(cand).slice(0, n - 1);
  const rest = shuffle(pool.filter(x => !cand.includes(x)));
  while (cand.length < n - 1 && rest.length) cand.push(rest.pop());
  return shuffle([item, ...cand].map(x => x[field]));
}
/* 예문 속에서 단어(활용형 포함) 위치 찾기 */
function blankOf(item) {
  const e = item.e || '', k = item.k.replace(/(する|だ)$/, '');
  for (let cut = 0; cut <= 2; cut++) {
    const stem = cut ? k.slice(0, -cut) : k;
    if (stem.length < 1 || (cut && stem.length < 1)) break;
    const i = e.indexOf(stem);
    if (i >= 0) { let j = i + stem.length; if (cut && /[ぁ-ん]$/.test(item.k)) while (j < e.length && /[ぁ-ん]/.test(e[j]) && j - i - stem.length < 2 && !'をがにはでとものへてたか、。'.includes(e[j])) j++; return [i, j]; }
  }
  return null;
}
/* 책 단어: 장음·촉음·탁음 함정 보기 만들기 */
const DAK = { か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ' };
const UND = {}; Object.entries(DAK).forEach(([a, b]) => UND[b] = a);
const HAN = { は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ',ば:'ぱ',び:'ぴ',ぶ:'ぷ',べ:'ぺ',ぼ:'ぽ',ぱ:'ば',ぴ:'び',ぷ:'ぶ',ぺ:'べ',ぽ:'ぼ' };
const SMALL = { ゃ:'や',ゅ:'ゆ',ょ:'よ',や:'ゃ',ゆ:'ゅ',よ:'ょ' };
const O_ROW = 'おこごそぞとどのほぼぽもよろょ', U_ROW = 'うくぐすずつづぬふぶぷむゆるゅ';
function traps(r) {
  const out = new Set(), a = [...r];
  a.forEach((ch, i) => {
    const sw = (x) => { const b = a.slice(); b[i] = x; out.add(b.join('')); };
    if (DAK[ch]) sw(DAK[ch]); if (UND[ch]) sw(UND[ch]); if (HAN[ch]) sw(HAN[ch]);
    if (SMALL[ch] && i > 0) sw(SMALL[ch]);
    if (ch === 'っ') { sw('つ'); const b = a.slice(); b.splice(i, 1); out.add(b.join('')); }
    if (ch === 'う' && i > 0 && (O_ROW + U_ROW).includes(a[i - 1])) { const b = a.slice(); b.splice(i, 1); out.add(b.join('')); }
    if (ch === 'い' && i > 0 && 'えけげせぜてでねへべぺめれ'.includes(a[i - 1])) { const b = a.slice(); b.splice(i, 1); out.add(b.join('')); }
    if ((O_ROW + U_ROW).includes(ch) && a[i + 1] !== 'う' && i < a.length - 1) { const b = a.slice(); b.splice(i + 1, 0, 'う'); out.add(b.join('')); }
    if ('かきくけこさしすせそたちつてとぱぴぷぺぽ'.includes(a[i + 1] || '') && i < a.length - 1 && ch !== 'っ' && ch !== 'ん' && Math.random() < .5) { const b = a.slice(); b.splice(i + 1, 0, 'っ'); out.add(b.join('')); }
  });
  out.delete(r); return shuffle([...out]);
}
/* 책 '표기': 모양·발음이 비슷한 한자로 바꾼 가짜 보기 (예: 勤める → 働める) */
const LOOK = ["院員", "影映", "仮過価", "解改", "観歓関感間", "器機期規基季", "自持", "常情乗", "心進", "正成", "専線", "相想争", "続足", "点伝", "強教", "決結欠", "現限減", "交更", "最際", "志誌紙", "側測", "氷泳", "録緑", "詳訳説", "寄宿", "輸論", "消削", "現視", "逃追通", "報績積", "原源", "比批", "注泣", "身射", "倍部", "暮募", "痛疲", "案家", "健建", "温混", "組結経続", "検険", "左存在", "複復服", "止停阻禁防", "葉根種", "戻回帰退", "放離別", "池波泉", "保守", "都道", "反犯", "捕報", "容用", "律立", "料量", "齢冷", "折曲", "習学", "夕夜", "翌後終", "庭園", "屋室", "焼燃", "拡張", "降落", "当打", "金銀", "必確", "信頼", "育教", "大多", "速早急", "進移", "勤務働", "券票", "細浅", "映写", "独単", "借貸", "血皿", "投役", "頼預", "順囲困", "貧質", "眠眼", "寺待"];
const LOOKMAP = {}; LOOK.forEach(g => [...g].forEach(ch => (LOOKMAP[ch] = LOOKMAP[ch] || new Set()) && [...g].forEach(o => o !== ch && LOOKMAP[ch].add(o))));
function kanjiTraps(k) {
  const out = new Set(), a = [...k];
  a.forEach((ch, i) => (LOOKMAP[ch] ? [...LOOKMAP[ch]] : []).forEach(o => { const b = a.slice(); b[i] = o; out.add(b.join('')); }));
  out.delete(k); return shuffle([...out]);
}
function buildSteps(item) {
  if (S.mode === 'grammar') {
    return Math.random() < .6
      ? [{ type: 'blank' }, { type: 'gmean' }]
      : [{ type: 'gmean' }, { type: 'blank' }];
  }
  if (item.syn) return [{ type: 'syn' }];   // 유의표현: 가장 가까운 표현 고르기
  if (item.c && item.e && blankOf(item)) return !item.g && item.k !== item.r && Math.random() < .5 ? [{ type: 'ctx' }, { type: 'k2r' }] : [{ type: 'ctx' }];
  if (item.k === item.r) return [{ type: Math.random() < .7 ? 'k2m' : 'm2k' }];   // 가나로만 쓰는 단어
  if (item.w) return [{ type: 'r2k' }, { type: 'k2m' }];   // 책 '표기' 파트: 히라가나 보고 한자 고르기
  const rev = Math.random() < .22;   // 가끔 거꾸로: 뜻 → 한자
  return rev ? [{ type: 'm2k' }, { type: 'k2r' }] : [{ type: 'k2r' }, { type: 'k2m' }];
}
function newQ() {
  const id = pick(), item = D[S.mode][id];
  cur = { id, item, steps: buildSteps(item), si: 0, okAll: true };
  renderStep();
}
function renderStep() {
  const { steps, si } = cur, t = steps[si].type, n = S.n;
  $('card').classList.remove('okfx', 'ngfx');
  $('reveal').classList.remove('on'); $('nextBtn').classList.remove('on');
  const item = cur.item;
  const names = { syn: '비슷한 말', ctx: '빈칸', r2k: '한자', k2r: '읽기', k2m: '뜻', m2k: '한자', blank: '빈칸', gmean: '의미' };
  $('steps').innerHTML = steps.map((s, i) => `<i class="${i < si ? 'done' : i === si ? 'on' : ''}">${i + 1}. ${names[s.type]}</i>`).join('<span>→</span>');
  const s = S.prog[S.mode][cur.id]; $('boxLv').textContent = (item.s ? `${item.st ? '⭐중요 · ' : ''}${item.s} · ` : '') + (s && s.seen ? '★'.repeat(s.b) + '☆'.repeat(5 - s.b) : 'NEW');
  let q = '', ask = '', opts = [], field = '', jp = false;
  const bigCls = (txt) => 'big' + (String(txt).length > 3 ? ' long' : '');
  if (t === 'k2r') {
    q = `<div class="${bigCls(item.k)}">${esc(item.k)}</div><div class="sub">${si ? esc(item.m) : '&nbsp;'}</div>`;
    ask = '어떻게 읽을까요?'; field = 'r'; jp = true;
    if (S.mode === 'book') {
      const t = traps(item.r).slice(0, n - 1);
      const more = distract('r', item, n).filter(x => x !== item.r && !t.includes(x));
      while (t.length < n - 1 && more.length) t.push(more.pop());
      opts = shuffle([item.r, ...t]);
    } else opts = distract('r', item, n, x => x.r[0] === item.r[0] || Math.abs(x.r.length - item.r.length) <= 1);
  } else if (t === 'ctx') {
    const [a, b] = blankOf(item), e = item.e;
    q = `<div class="sent">${esc(e.slice(0, a))}<u>　</u>${esc(e.slice(b))}</div><div class="sub">${esc(item.em || '')}</div>`;
    ask = '빈칸에 들어갈 말은?'; field = 'k'; jp = true;
    opts = distract('k', item, n, x => x.c && !x.syn && (item.g ? x.s === item.s : !x.g));   // 조사는 조사끼리, 부사는 부사끼리
  } else if (t === 'syn') {
    q = `<div class="big long" style="font-family:inherit;font-weight:900">${esc(item.k)}</div><div class="sub">${esc(item.m)}</div>`;
    ask = '가장 가까운 의미는?'; field = 'syn'; jp = true;
    opts = distract('syn', item, n, x => !!x.syn);
  } else if (t === 'r2k') {
    q = `<div class="big ko" style="color:var(--shu)">${esc(item.r)}</div><div class="sub">&nbsp;</div>`;
    ask = '맞는 한자 표기는?'; field = 'k'; jp = true;
    const chars = [...item.k].filter(c => /[\u4e00-\u9fff]/.test(c));
    const t2 = kanjiTraps(item.k).slice(0, n - 1);
    const more = distract('k', item, n, x => x.r === item.r || [...x.k].some(c => chars.includes(c))).filter(x => x !== item.k && !t2.includes(x));
    while (t2.length < n - 1 && more.length) t2.push(more.pop());
    opts = shuffle([item.k, ...t2]);
  } else if (t === 'k2m') {
    q = `<div class="${bigCls(item.k)}">${esc(item.k)}</div><div class="sub"><span class="kana">${item.k === item.r ? '&nbsp;' : esc(item.r)}</span></div>`;
    ask = '뜻은?'; field = 'm';
    opts = distract('m', item, n);
  } else if (t === 'm2k') {
    q = `<div class="big ko">${esc(item.m)}</div><div class="sub">&nbsp;</div>`;
    ask = item.k === item.r ? '어떤 단어일까요?' : '어떤 한자일까요?'; field = 'k'; jp = true;
    opts = distract('k', item, n, x => [...x.k].some(c => item.k.includes(c) && /[一-鿿]/.test(c)));
  } else if (t === 'blank') {
    const frag = (item.s.match(/\{([^}]*)\}/g) || []).map(x => x.slice(1, -1));
    const sent = item.s.replace(/\{[^}]*\}/g, '<u>　</u>');
    q = `<div class="sent">${sent}</div><div class="sub">${si ? esc(item.t) : '&nbsp;'}</div>`;
    ask = '빈칸에 들어갈 문법은?'; field = 'p'; jp = true;
    opts = distract('p', item, n);
    cur.frag = frag;
  } else if (t === 'gmean') {
    q = `<div class="big long" style="font-family:inherit;font-weight:900">${esc(item.p)}</div><div class="sub">&nbsp;</div>`;
    ask = '무슨 뜻일까요?'; field = 'm';
    opts = distract('m', item, n);
  }
  cur.field = field;
  $('q').innerHTML = q; $('ask').textContent = ask;
  $('opts').innerHTML = opts.map(o => `<button class="${jp ? 'jp' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  $('opts').querySelectorAll('button').forEach(b => b.onclick = () => answer(b));
}
let lock = false;
function answer(btn) {
  if (lock) return; lock = true;
  const { item, field } = cur, right = item[field];
  const good = btn.dataset.v === right;
  $('opts').querySelectorAll('button').forEach(b => { if (b.dataset.v === right) b.classList.add('ok'); });
  if (!good) { btn.classList.add('ng'); cur.okAll = false; $('card').classList.add('ngfx'); if (navigator.vibrate) navigator.vibrate(60); }
  else $('card').classList.add('okfx');
  S.tot++; if (good) { S.ok++; S.streak++; } else S.streak = 0;
  S.today++;
  const t = cur.steps[cur.si].type;
  if (good && (t === 'k2r' || t === 'm2k' || t === 'r2k' || (t === 'k2m' && item.k === item.r)) && S.speak) speak(item.r);
  const last = cur.si === cur.steps.length - 1;
  if (last || !good) showReveal();
  if (!good) { $('nextBtn').classList.add('on'); lock = false; finishWord(false); return; }
  const mine = cur;   // 그 사이 탭을 바꾸면 이전 문제 타이머는 무시
  setTimeout(() => {
    if (cur !== mine) return;
    lock = false;
    if (!last) { cur.si++; renderStep(); }
    else { finishWord(true); $('nextBtn').classList.add('on'); }   // 마지막 카드는 '다음'을 누를 때까지 그대로
  }, last ? 250 : 480);
  updStats();
}
let finished = false;
function finishWord(good) {
  if (finished) return; finished = true;
  S.tick++; grade(cur.id, good && cur.okAll); save(); updStats();
}
function showReveal() {
  const it = cur.item; let h;
  if (it.syn) h = `<div class="t">${esc(it.k)} ≒ ${esc(it.syn)}</div><div class="e">${esc(it.m)} ≒ ${esc(it.sm)}</div>`;
  else if (S.mode === 'grammar') h = `<div class="t">${esc(it.p)} <small style="font-size:.8rem;color:var(--sub)">${esc(it.m)}</small></div><div class="e">${esc(it.s.replace(/[{}]/g, ''))}<br>${esc(it.t)}</div>`;
  else h = `<div class="t"><span>${esc(it.k)}</span> · <span class="r">${esc(it.r)}</span> · ${esc(it.m)}</div>${it.e ? `<div class="e">${esc(it.e)}<br>${esc(it.em || '')}</div>` : ''}`;
  $('reveal').innerHTML = h; $('reveal').classList.add('on');
}
function nextQ() { finished = false; lock = false; newQ(); }

/* ───────── 소리 (일본어 발음) ───────── */
function speak(txt) {
  try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'ja-JP'; u.rate = .95; speechSynthesis.speak(u); } catch (e) {}
}

/* ───────── 통계 ───────── */
function updStats() {
  $('stToday').textContent = S.today;
  $('stRate').textContent = S.tot ? Math.round(S.ok / S.tot * 100) + '%' : '-';
  $('stStreak').textContent = S.streak;
  const p = S.prog[S.mode], total = D[S.mode].length;
  const m = Object.values(p).filter(x => x.b >= 4).length;
  $('stMaster').textContent = `${m}/${total}`;
  $('progBar').style.width = (total ? m / total * 100 : 0) + '%';
}

/* ───────── 📖 책 보기 (전체 목록, 쓰면서 외우기) ───────── */
let bvSec = '전체', bvHide = 0, bvOpen = new Set();   // 가리기: 0 없음, 1 뜻, 2 읽기+뜻
function openBook() { $('bookv').classList.add('on'); renderBook(); }
function closeBook() { $('bookv').classList.remove('on'); }
function renderBook() {
  const all = D.book || [];
  const secs = ['전체', '⭐중요', ...new Set(all.map(x => x.s))];
  $('bvSec').innerHTML = secs.map(x => `<button class="${x === bvSec ? 'on' : ''}" onclick="bvSec='${x}';renderBook()">${x}</button>`).join('');
  $('bvHide').textContent = ['가리기', '뜻 가림', '읽기+뜻 가림'][bvHide];
  const q = $('bvQ').value.trim();
  let list = all.map((x, i) => [x, i]).filter(([x]) => bvSec === '전체' || (bvSec === '⭐중요' ? x.st : x.s === bvSec));
  if (q) list = list.filter(([x]) => [x.k, x.r, x.m, x.syn, x.sm].some(v => v && String(v).includes(q)));
  let h = '', last = '';
  for (const [x, i] of list) {
    if (x.s !== last) { h += `<div class="bv-h">${esc(x.s)}</div>`; last = x.s; }
    const show = bvOpen.has(i), hm = bvHide >= 1 && !show, hr = bvHide >= 2 && !show;
    const r = x.syn ? `≒ ${x.syn}` : (x.r && x.r !== x.k ? x.r : '');
    const m = x.syn ? `${x.m} ≒ ${x.sm}` : x.m;
    h += `<div class="bv-row" onclick="bvOpen.has(${i})?bvOpen.delete(${i}):bvOpen.add(${i});renderBook()">
      <div class="k">${esc(x.k)}${x.st ? '<i>★</i>' : ''}</div>
      <div class="r ${hr ? 'hid' : ''}">${esc(r)}</div>
      <div class="m ${hm ? 'hid' : ''}">${esc(m)}</div>
      ${x.e && (show || !bvHide) ? `<div class="ex">${esc(x.e)}<br>${esc(x.em || '')}</div>` : ''}</div>`;
  }
  $('bvList').innerHTML = h || '<p style="padding:20px;color:var(--sub)">찾는 단어가 없어요</p>';
}

/* ───────── 탭 · 설정 · 오답 ───────── */
function setMode(m) {
  S.mode = m; save();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  updStats(); nextQ();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setMode(b.dataset.m));
function openSheet(kind) {
  let h = '';
  if (kind === 'set') {
    h = `<h3>설정</h3>
      <div class="row">보기 개수<div class="seg">${[3, 4].map(n => `<button class="${S.n === n ? 'on' : ''}" onclick="S.n=${n};save();openSheet('set');nextQ()">${n}개</button>`).join('')}</div></div>
      <div class="row">정답 때 발음 듣기<div class="seg">${[['켜기', true], ['끄기', false]].map(([l, v]) => `<button class="${S.speak === v ? 'on' : ''}" onclick="S.speak=${v};save();openSheet('set')">${l}</button>`).join('')}</div></div>
      <div class="row">책 ${D.book.length}개 · 단어 ${D.words.length}개 · 한자 ${D.kanji.length}개 · 문법 ${D.grammar.length}개</div>
      <button class="danger" onclick="if(confirm('${{ book: '책', words: '단어', kanji: '한자', grammar: '문법' }[S.mode]} 학습 기록을 처음부터 다시 할까요?')){S.prog[S.mode]={};S.wrong[S.mode]=[];save();closeSheet();updStats();nextQ()}">이 탭 기록 초기화</button>`;
  } else {
    const ids = S.wrong[S.mode] || [];
    h = `<h3>📕 오답 노트 <small style="font-size:.78rem;color:var(--sub)">${ids.length}개 · 맞히면 자동으로 빠져요</small></h3>
      <div class="list">${ids.length ? ids.map(i => D[S.mode][i]).filter(Boolean).map(x => S.mode === 'grammar'
        ? `<div class="li"><b style="font-family:inherit">${esc(x.p)}</b><div>${esc(x.m)}</div></div>`
        : `<div class="li"><b>${esc(x.k)}</b><span>${esc(x.r)}</span><div>${esc(x.m)}</div></div>`).join('') : '<p style="color:var(--sub);padding:14px 0">아직 틀린 게 없어요 👍</p>'}</div>`;
  }
  $('sheetBody').innerHTML = h; $('sheet').classList.add('on');
}
function closeSheet() { $('sheet').classList.remove('on'); }
document.addEventListener('keydown', e => { const k = +e.key; if (k >= 1 && k <= 4) { const b = $('opts').querySelectorAll('button')[k - 1]; if (b) b.click(); } if (e.key === 'Enter' && $('nextBtn').classList.contains('on')) nextQ(); });

/* ───────── 잠금 (비밀번호는 저장하지 않고, 변환한 값만 비교) ───────── */
const PIN_SALT = 'fukudaegu-n3-salt-v1';
const PIN_CHECK = '9a3b956f033a962f9edc3a7fd57630cd3049b3ab8e4323bfa4d83dda1758b756';
async function deriveKeyBits(pin) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(PIN_SALT), iterations: 200000, hash: 'SHA-256' }, base, 256));
}
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
async function checkBits(bits) { return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', bits))) === PIN_CHECK; }
let pinVal = '';
function drawPin() {
  $('pinDots').innerHTML = [0, 1, 2, 3, 4, 5].map(i => `<i class="${i < pinVal.length ? 'f' : ''}"></i>`).join('');
}
$('pinPad').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('');
$('pinPad').querySelectorAll('button').forEach(b => b.onclick = async () => {
  const k = b.dataset.k;
  if (k === '⌫') pinVal = pinVal.slice(0, -1); else if (pinVal.length < 6) pinVal += k;
  drawPin();
  if (pinVal.length === 6) {
    $('pinMsg').textContent = '확인 중…';
    const bits = await deriveKeyBits(pinVal);
    if (await checkBits(bits)) { try { localStorage.setItem('fuku_n3_key', hex(bits)); } catch (e) {} unlock(bits); }
    else { $('pinMsg').textContent = '비밀번호가 달라요'; pinVal = ''; drawPin(); }
  }
});
drawPin();
let KEYBITS = null;
function unlock(bits) { KEYBITS = bits; $('lock').classList.add('off'); start(); }
async function loadBook() {
  try {
    const b64 = await (await fetch('/data/book.enc?v=5')).text();
    const raw = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', KEYBITS, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plain)).words;
  } catch (e) { return []; }
}
(async () => {   // 이 폰에서 한 번 열었으면 다음부터 바로 열림
  try { const h = localStorage.getItem('fuku_n3_key'); const bits = h && new Uint8Array(h.match(/../g).map(x => parseInt(x, 16))); if (bits && await checkBits(bits)) return unlock(bits); } catch (e) {}
})();

/* ───────── 시작 ───────── */
let started = false;
function start() { if (started) return; started = true;
Promise.all([fetch('/data/n3.json?v=2').then(r => r.json()), loadBook()]).then(([d, book]) => {
  D = d; D.book = book;
  if (!S.bookIntro) { S.bookIntro = 1; S.mode = 'book'; }
  if (S.dataV !== d.v) { S.prog.words = {}; S.wrong.words = []; S.dataV = d.v; save(); }   // 단어 목록이 바뀌면 단어 기록만 새로
  setMode(S.mode || 'words');
})
  .catch(() => { $('q').innerHTML = '<div class="sub">데이터를 불러오지 못했어요. 새로고침해 주세요.</div>'; });
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
</script>
